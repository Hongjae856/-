<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTP 라인 IDT</title>
<style>
[hidden]{display:none!important}
body.appModal #cv,body.appModal #cross,body.appModal #hud,body.appModal #fpTip{visibility:hidden!important}
/*__OEECSS__*/
:root{--ink:#142b47;--sub:#5d7086;--line:#c9d4e0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#dfe4e1;color:var(--ink);font-family:"Malgun Gothic",Arial,sans-serif;overflow:hidden}
button{font-family:inherit}
#bar{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);z-index:20;white-space:nowrap}
.brand{font-weight:800;font-size:16px;letter-spacing:-.5px}
.seg{display:flex;border:1px solid #b7c4d2;border-radius:11px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--ink);font:800 14px "Malgun Gothic",Arial,sans-serif;padding:8px 14px;cursor:pointer}
.seg button+button{border-left:1px solid #b7c4d2}
.seg button.on{background:var(--ink);color:#fff}
.chip{font-size:12.5px;color:#6b4e00;background:#fff4cc;border-radius:999px;padding:4px 10px;font-weight:700}
.sp{flex:1}
#info{font-size:12.5px;color:var(--sub)}
#stage{position:fixed;left:0;right:0;top:52px;bottom:0}
#apps{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:0}
#apps.live{opacity:1;pointer-events:auto}
#apps iframe.off{visibility:hidden}
.gb{border:1px solid #b7c4d2;border-radius:10px;background:#fff;color:var(--ink);font:700 13.5px "Malgun Gothic",Arial,sans-serif;padding:7px 12px;cursor:pointer}
.gb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#splash{position:absolute;inset:0;z-index:5;background:linear-gradient(180deg,#f5f7f9,#e8edf1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:auto;padding:24px}
#splash.hide{display:none}
#splash h1{margin:0;font:800 44px "Malgun Gothic",Arial,sans-serif;letter-spacing:-1px;color:var(--ink)}
#splash .sub{margin:-6px 0 0;font:700 14px "Malgun Gothic",Arial,sans-serif;color:var(--sub);letter-spacing:1px}
#crewHint{font:600 16px/1.5 "Malgun Gothic",Arial,sans-serif;color:#40566e;text-align:center}
#crewHint b{color:var(--ink)} #crewHint s{text-decoration:none;margin-left:10px;padding:2px 10px;border-radius:999px;background:#fff4cc;color:#6b4e00}
#workers{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:min(900px,100%)}
#workers button{padding:22px 24px;text-align:left;border:1px solid #b7c4d2;border-radius:20px;background:#142b47;color:#fff;cursor:pointer;font-family:inherit}
#workers button small{display:block;font-size:13px;letter-spacing:2px;opacity:.7}
#workers button strong{display:block;font-size:28px;margin:8px 0}
#workers button span{display:block;font-size:16px;line-height:1.5}
#workers button.wait{opacity:.55} #workers button.sel{outline:4px solid #f5b400;outline-offset:3px}
#modes{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;width:min(1380px,100%)}
.mcol{display:flex;flex-direction:column;gap:10px}
.mcol h4{margin:0;text-align:center;font:800 18px "Malgun Gothic",Arial,sans-serif;color:#5d7086;letter-spacing:3px}
.mcol button{font:700 19px "Malgun Gothic",Arial,sans-serif;padding:14px 12px;border:1px solid #152c4b;border-radius:14px;cursor:pointer;background:#142b47;color:#fff;word-break:keep-all}
.mcol button.e{background:#fff;color:#142b47}
.mcol button small{display:block;font:600 12.5px/1.4 "Malgun Gothic",Arial,sans-serif;opacity:.75;margin-top:4px}
.mcol button.sel{outline:4px solid #f5b400;outline-offset:3px}
.mcol button:disabled{opacity:.42;cursor:not-allowed}
.mcol.ch button{background:#1d5c7a;border-color:#174a62} .mcol.ch button.e{background:#fff;color:#174a62}
.mcol.demo button{background:#2b8a4b;border-color:#1d6b38} .mcol.free button{background:#5b3fa0;border-color:#45307c} .mcol.oee button{background:#e0714a;border-color:#c85d38}
#apps iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#cv{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block;outline:none}
#hud{position:absolute;left:12px;bottom:12px;z-index:2;background:#ffffffd9;border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.6;color:var(--ink);max-width:520px}
#hud b{font-weight:800}
#fpTip{position:absolute;z-index:2;transform:translateX(-50%);background:#142b47e6;color:#fff;border-radius:999px;padding:7px 16px;font-size:14px;white-space:nowrap;pointer-events:none}
#fpTip kbd{display:inline-block;min-width:20px;padding:1px 6px;border-radius:5px;background:#fff;color:#142b47;font:800 12px "Malgun Gothic",Arial,sans-serif;margin:0 2px}
#fpTip .far{color:#ffd9a0;font-weight:800}#fpTip em{font-style:normal;color:#ffd22e;font-weight:800;margin-left:4px}
body.appModal .aimEdge{display:none!important}
#fpTip s{text-decoration:none;margin-left:8px;padding:1px 8px;border-radius:999px;background:#ffd22e;color:#3a2a00;font-weight:800;font-size:12px}
#shCoach{position:absolute;z-index:3;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:#fff;border-left:6px solid #2b8a4b;box-shadow:0 2px 10px #142b4718}
#shCoach.free{border-left-color:#5b3fa0;background:#f8f5ff}
#shCoach .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#shCoach .t small{font:800 12.5px "Malgun Gothic",Arial,sans-serif;color:#2b8a4b}#shCoach.free .t small{color:#5b3fa0}
#shCoach .t b{font:800 18px "Malgun Gothic",Arial,sans-serif;color:var(--ink)}#shCoach .t span{font-size:13px;color:var(--sub);line-height:1.4}
#shCoach .b{display:flex;gap:6px;flex:0 0 auto}
#shCoach button{padding:10px 14px;border:0;border-radius:10px;background:linear-gradient(180deg,#ffd84d,#f0b400);color:#3a2a00;font:800 15px "Malgun Gothic",Arial,sans-serif;cursor:pointer}
#shCoach.free button{background:#5b3fa0;color:#fff}#shCoach.free button+button{background:#fff;color:#45307c;border:1px solid #5b3fa0}
#incPick{width:min(980px,100%);background:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 4px 20px #142b4714}
#incPick h3{margin:0 0 4px;font:800 20px "Malgun Gothic",Arial,sans-serif}#incPick p{margin:0 0 10px;color:var(--sub);font-size:13.5px}
#incPick .ip{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #e3e8ee}
#incPick .ip span{width:26px;text-align:center;font-weight:800;color:var(--sub)}#incPick .ip b{flex:1;font-size:15.5px}#incPick .ip b s{display:block;text-decoration:none;font:600 12px "Malgun Gothic",Arial,sans-serif;color:var(--sub)}
#incPick .ip button,#incBack{padding:8px 14px;border-radius:10px;border:1px solid #c85d38;background:#e0714a;color:#fff;font:800 14px "Malgun Gothic",Arial,sans-serif;cursor:pointer}
#incPick .ip button.e{background:#fff;color:#b04a26}#incBack{margin-top:10px;background:#fff;color:var(--ink);border-color:#b7c4d2}
#shCoach.inc{border-left-color:#e0714a;background:#fff7ee}#shCoach.inc .t small{color:#b04a26}#shCoach.inc button{background:#e0714a;color:#fff}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:2;pointer-events:none;display:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{left:0;top:6px;width:14px;height:2px}
#load{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:#eef1f4;font-size:18px;font-weight:700;color:var(--sub)}

/* 메인화면 — 파우치 기준 (11/18) : 상단 바 없는 전체 화면 · OEE 연동 표시(왼쪽 아래) · 버전(오른쪽 아래) */
#splash{position:fixed!important;inset:0!important;z-index:40!important}
#spVer{position:absolute;right:22px;bottom:16px;border:1px solid #d5dee8;border-radius:16px;background:#fff;padding:6px 12px;font:800 13px "Malgun Gothic","Noto Sans KR",sans-serif;color:#5d7086}
#splash,#splash *{font-family:"Malgun Gothic","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif}
.mcol.oee button{background:#e0714a!important;border-color:#c85d38!important;color:#fff!important}.mcol.oee button.e{background:#fff!important;color:#c2502b!important;border:2px solid #e0714a!important}
</style></head><body>
<div id="bar">
  <div class="brand">PTP 라인 IDT</div>
  <span class="chip" id="modeChip"></span>
  <div class="seg" id="crewSw"><button data-r="F">🧍 충전실 작업자</button><button data-r="P">🧍 포장실 작업자</button></div>
  <button class="gb" id="fpBtn">🧍 1인칭 → 3인칭 전환</button>
  <button class="gb" id="homeBtn">메인화면</button>
  <div class="sp"></div>
  <span id="info"></span>
</div>
<div id="stage">
  <div id="apps"></div>
  <canvas id="cv" tabindex="0"></canvas>
  <div id="cross"></div>
  <div id="hud"></div>
  <div id="fpTip" hidden></div>
  <div id="shCoach" hidden></div>
  <div id="splash">
    <h1>PTP 라인 IDT</h1><p class="sub">PTP Line · Interactive Digital Tutor · 블리스터 충전 → 카톤 포장</p>
    <div id="crewHint"></div>
    <div id="workers">
      <button id="chooseF"><small>작업자 1 · FILLING ROOM (D구역)</small><strong>🧍 충전실 작업자</strong><span>블리스터 포장기 HM 400P · 성형 · 실링 · 펀칭</span></button>
      <button id="chooseP"><small>작업자 2 · PACKING ROOM (G구역)</small><strong>🧍 포장실 작업자</strong><span>카토너 · 카톤 인쇄기 · 중량선별기 · 박스포장기 · 팔렛타이저</span></button>
    </div>
    <div id="modes">
      <div class="mcol"><h4>가동</h4><button data-c="operation" data-m="easy">기본 · 학습<small>가동 핵심 절차</small></button><button class="e" data-c="operation" data-m="examEasy">기본 · 평가</button><button data-c="operation" data-m="guide">심화 · 학습<small>가동 전체 절차</small></button><button class="e" data-c="operation" data-m="exam">심화 · 평가</button></div>
      <div class="mcol ch"><h4>체인지파트</h4><button data-c="change" data-m="easy">기본 · 학습<small>교체부품 6묶음</small></button><button class="e" data-c="change" data-m="examEasy">기본 · 평가</button><button data-c="change" data-m="guide">심화 · 학습<small>교체부품 18종</small></button><button class="e" data-c="change" data-m="exam">심화 · 평가</button></div>
      <div class="mcol demo"><h4>시연</h4><button data-c="operation" data-m="demo">시연모드<small>작업자별 장비 준비 → 가동 → 생산까지 간단히</small></button></div>
      <div class="mcol free"><h4>자유</h4><button data-c="operation" data-m="free">자유모드<small>순서 · 감점 · 평가 없음 · 기동 조건 해제</small></button></div>
      <div class="mcol oee"><h4>OEE</h4><button id="spOee">OEE 관리 대시보드<small>OEE DB 연결 · 부동 트렌드 · 교육 효과</small></button><button class="e" data-c="inc" data-m="inc">이상사례 대처 교육<small>부동 빈도 · 중요도 순 학습 · 평가</small></button></div>
    </div>
    <div id="incPick" hidden></div>
    <div id="spVer"></div>
  </div>
  <div id="load">설비 불러오는 중…</div>
</div>
<script>/*__THREE__*/</script>
<script id="apps-data" type="application/json">__APPS__</script>

</body></html>
